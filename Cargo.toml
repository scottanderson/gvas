[package]
name = "gvas"
description = "Crate for reading and writing UE4+ save files."
authors = ["localcc <work@localcc.cc>", "Scott Anderson"]
keywords = ["ue4", "unrealengine", "ue5", "gvas", "uasset"]
homepage = "https://github.com/localcc/gvas"
repository = "https://github.com/localcc/gvas"
readme = "README.md"
license = "MIT"
version = "0.11.0"
edition = "2024"

[dependencies]
binrw = "0.15.1"
chrono = "0.4.45"
flate2 = { version="1.1.5", optional = true }
modular-bitfield = "0.13.1"
serde = { version = "1.0.228", optional = true, features = ["derive"] }
serde_with = { version = "3.21.0", optional = true, features = ["chrono", "hex"] }
thiserror = "2.0.18"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = { version = "1.0.145", features = ["float_roundtrip", "preserve_order"] }

[features]
palworld = ["dep:flate2"]
serde = ["dep:serde", "dep:serde_with"]
